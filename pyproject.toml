[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waveos"
version = "0.1.0rc4"

description = "Wave OS demo CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "rich>=13.7",
  "jinja2>=3.1",
  "prometheus-client>=0.20"
]

[project.scripts]
waveos = "waveos.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
]
secrets = [
  "hvac>=2.0",
  "boto3>=1.34",
  "google-cloud-secret-manager>=2.20"
]
alerts = [
  "boto3>=1.34"
]

otel = [
  "opentelemetry-exporter-otlp>=1.25"
]
encryption = [
  "cryptography>=42.0"
]
ocpp = [
  "ocpp>=0.14.0",
  "websockets>=12.0"
]
modbus = [
  "pymodbus>=3.0.0"
]
mqtt = [
  "paho-mqtt>=2.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = ["src/waveos.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/waveos"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 45
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError"]
